name: Build APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Firestore access rules
        run: npm ci --no-audit --no-fund && npm run test:rules
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/listaspesa-signing.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/listaspesa-signing.p12" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ListaSpesa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ListaSpesa build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
